name: Deploy to playbook.trailmatt.com

on:
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: deploy-playbook
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Build
        run: |
          npm ci
          npm run build

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      # The Version workflow moves this on every push to main, so a matching number means
      # the release branch is carrying something that already shipped.
      - name: Check the version was bumped
        run: |
          version=`sh tools/site-version.sh`
          live=`aws s3 cp s3://${{ secrets.SITE_BUCKET }}/index.html - 2>/dev/null \
            | sh tools/site-version.sh -`
          if [ -z "$version" ]; then
            echo "No version-span found in shared/html/footer.html."
            exit 1
          fi
          if [ -z "$live" ]; then
            echo "Nothing live to compare against, releasing $version."
            exit 0
          fi
          if [ "$version" = "$live" ]; then
            echo "Version $version is already what is live. Push to main first so the Version workflow can bump it."
            exit 1
          fi
          echo "Releasing $live -> $version."

      # Hashed bundles cache forever, but the pages pointing at them can't or a release 404s.
      - name: Sync to S3
        run: |
          aws s3 sync dist/ s3://${{ secrets.SITE_BUCKET }} --delete --no-progress \
            --exclude "*" --include "*/main.*.bundle.js" --include "*/main.*.css" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync dist/ s3://${{ secrets.SITE_BUCKET }} --delete --no-progress \
            --exclude "*" --include "*.html" \
            --cache-control "no-cache"
          aws s3 sync dist/ s3://${{ secrets.SITE_BUCKET }} --delete --no-progress \
            --exclude "*.html" --exclude "*/main.*.bundle.js" --exclude "*/main.*.css" \
            --cache-control "public,max-age=300"

      - name: Deploy the board Lambdas
        run: |
          for game in connections geozee geogrid weaver; do
            rm -rf build-lambda && mkdir build-lambda
            cp "lambda/$game.mjs" build-lambda/index.mjs
            (cd build-lambda && zip -q -r ../board-lambda.zip index.mjs)
            aws lambda update-function-code \
              --function-name "$game-scraper" \
              --zip-file fileb://board-lambda.zip \
              --no-cli-pager > /dev/null
            rm board-lambda.zip
          done

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" --no-cli-pager > /dev/null

      - name: Tag the release
        run: |
          # Last, so that a tag only ever exists for a release that actually shipped.
          version=`sh tools/site-version.sh`
          if [ -n "`git ls-remote --tags origin refs/tags/$version`" ]; then
            echo "$version is already tagged, leaving it alone."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$version" -m "Release $version"
          git push origin "$version"
          echo "Tagged $version."
