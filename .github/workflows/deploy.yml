name: Deploy to playbook.trailmatt.com

on:
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: deploy-playbook
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Build
        run: |
          npm ci
          npm run build

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      # Hashed bundles cache forever, but the pages pointing at them can't or a release 404s.
      - name: Sync to S3
        run: |
          aws s3 sync dist/ s3://${{ secrets.SITE_BUCKET }} --delete --no-progress \
            --exclude "*" --include "*/main.*.bundle.js" --include "*/main.*.css" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync dist/ s3://${{ secrets.SITE_BUCKET }} --delete --no-progress \
            --exclude "*" --include "*.html" \
            --cache-control "no-cache"
          aws s3 sync dist/ s3://${{ secrets.SITE_BUCKET }} --delete --no-progress \
            --exclude "*.html" --exclude "*/main.*.bundle.js" --exclude "*/main.*.css" \
            --cache-control "public,max-age=300"

      - name: Deploy the board Lambdas
        run: |
          for game in connections geozee; do
            rm -rf build-lambda && mkdir build-lambda
            cp "lambda/$game.mjs" build-lambda/index.mjs
            (cd build-lambda && zip -q -r ../board-lambda.zip index.mjs)
            aws lambda update-function-code \
              --function-name "$game-scraper" \
              --zip-file fileb://board-lambda.zip \
              --no-cli-pager > /dev/null
            rm board-lambda.zip
          done

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" --no-cli-pager > /dev/null
