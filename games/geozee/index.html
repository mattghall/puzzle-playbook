<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link rel="manifest" href="/geozee/manifest.json">
    <link rel="preconnect" href="https://flagcdn.com" crossorigin>
    <title>Geozee Helper</title>
    <!-- Facebook Meta -->
    <meta property="og:url" content="https://playbook.trailmatt.com/geozee" />
    <meta property="og:title" content="Geozee Helper" />
    <meta property="og:description"
        content="A scratchpad for the daily Geozee puzzle. Try every country in every category before you commit to a placement." />
    <!-- Twitter Meta -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Geozee Helper" />
    <meta name="twitter:url" content="https://playbook.trailmatt.com/geozee" />
    <meta name="twitter:site" content="@MattGHall" />
    <meta name="twitter:creator" content="@MattGHall">
    <meta name="twitter:description"
        content="A scratchpad for the daily Geozee puzzle. Try every country in every category before you commit to a placement." />

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="/dep/jquery-3.5.1.min.js"></script>
    <link href="/dep/bootstrap.min.css" rel="stylesheet">
    <script src="/dep/bootstrap.min.js"></script>

    <link rel="stylesheet" href="/geozee/main.css">
    <script src="/geozee/main.bundle.js"></script>

</head>

<body>
    <div id="loading-overlay">
        <div class="spinner"></div>
    </div>
    <div class="container mt-2">
        <div class="row">
            <div class="col-12 col-lg-8 offset-lg-4">
                <div id="buttons-div" class="row">
                    <div class="col-4 d-lg-none">
                        <button id="view-toggle-btn" class="game-btn btn btn-primary">List</button>
                    </div>
                    <div class="col-4 col-lg-6">
                        <button id="clear-btn" class="game-btn btn btn-danger">Reset</button>
                    </div>
                    <div class="col-4 col-lg-6">
                        <input type="date" id="date-picker" class="form-control game-btn">
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div id="picks-col" class="col-12 col-lg-4 mobile-hidden">
                <div id="picks-label" class="queue-label">Your picks</div>
                <div id="picks-list" class="picks-list">
                    <!-- Placement rows are created dynamically -->
                </div>
            </div>
            <div id="game-col" class="col-12 col-lg-8">
                <div id="queue-label" class="queue-label">Countries</div>
                <div id="queue" class="queue">
                    <!-- Country boxes are created dynamically -->
                </div>
                <div id="board" class="board mt-3">
                    <!-- Category slots are created dynamically -->
                </div>
                <div id="flag-preview" class="flag-preview">
                    <!-- Zoomed flag for the selected country -->
                </div>
                <div id="fetch-error" class="alert alert-warning mt-2" style="display: none"></div>
            </div>
        </div>
    </div>

    <div id="footer-row" class="row justify-content-center bg-dark text-white">
        <div class="col-12 text-center px-1 px-md-2 pt-1" id="footer-title">
            playbook.trailmatt.com - <span class="version-span">1.1.0</span>
        </div>
        <div class="col-4 text-center px-1 px-md-2 pt-1 fileVersions" style="display: none">
            main.js <span id="main-version-span">x.x</span><br />
            style.css <span id="style-version-span"></span>
        </div>
        <div class="social text-center col-12 px-1 px-md-2 pb-1">
            <section>
                <a class="btn btn-outline-light btn-floating m-1" href="https://geozee.earth" target="_blank"
                    role="button">Play Geozee</a>
                <a class="btn btn-outline-light btn-floating m-1" href="https://games.mattghall.com" target="_blank"
                    role="button">More Games</a>
                <a class="btn btn-outline-light btn-floating m-1" href="https://playbook.trailmatt.com"
                    role="button"><i data-feather="home"></i></a>
                <a class="btn btn-outline-light btn-floating m-1" href="https://github.com/mattghall/puzzle-playbook"
                    target="_blank" role="button"><i data-feather="github"></i></a>
            </section>
        </div>
    </div>

</body>

</html>
