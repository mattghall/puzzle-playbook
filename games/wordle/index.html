<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png">
    <link rel="manifest" href="/wordle/manifest.json">
    <title>Wordle Helper</title>
    <meta property="og:url" content="https://playbook.trailmatt.com/wordle" />
    <meta property="og:title" content="Wordle Helper" />
    <meta property="og:description"
        content="A scratchpad for the daily Wordle. Track what you know and see every word still left in the bank." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wordle Helper" />
    <meta name="twitter:url" content="https://playbook.trailmatt.com/wordle" />
    <meta name="twitter:site" content="@MattGHall" />
    <meta name="twitter:creator" content="@MattGHall">
    <meta name="twitter:description"
        content="A scratchpad for the daily Wordle. Track what you know and see every word still left in the bank." />

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="/dep/jquery-3.5.1.min.js"></script>
    <link href="/dep/bootstrap.min.css" rel="stylesheet">
    <script src="/dep/bootstrap.min.js"></script>

</head>

<body>
    <div class="container">
        <ul class="nav nav-tabs" id="helper-tabs" role="tablist">
            <li class="nav-item">
                <a class="nav-link active" id="wordle-tab" href="#wordle-pane" role="tab">Wordle</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" id="word500-tab" href="#word500-pane" role="tab">Word500</a>
            </li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="wordle-pane" role="tabpanel">
                <div class="input-panel">
                    <div id="guesses" class="wordle-row">
                        <table border="3">
                            <tbody>
                                <tr class="guess">
                                    <td><input id="g0" maxlength="1" class="l-box" type="text"></td>
                                    <td><input id="g1" maxlength="1" class="l-box" type="text"></td>
                                    <td><input id="g2" maxlength="1" class="l-box" type="text"></td>
                                    <td><input id="g3" maxlength="1" class="l-box" type="text"></td>
                                    <td><input id="g4" maxlength="1" class="l-box" type="text"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Green letters, in the spot the game put them -->
                    <div class="wordle-row bg-success">
                        <table border="3">
                            <tbody>
                                <tr class="winners">
                                    <td><input id="w0" placeholder=" " class="l-box" type="text"></td>
                                    <td><input id="w1" placeholder=" " class="l-box" type="text"></td>
                                    <td><input id="w2" placeholder=" " class="l-box" type="text"></td>
                                    <td><input id="w3" placeholder=" " class="l-box" type="text"></td>
                                    <td><input id="w4" placeholder=" " class="l-box" type="text"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Yellow letters, in a spot they are known not to be -->
                    <div class="wordle-row bg-warning help-only" hidden>
                        <table border="3">
                            <tbody>
                                <tr class="cigars">
                                    <td><input id="c0" placeholder=" " class="l-box" type="text"></td>
                                    <td><input id="c1" placeholder=" " class="l-box" type="text"></td>
                                    <td><input id="c2" placeholder=" " class="l-box" type="text"></td>
                                    <td><input id="c3" placeholder=" " class="l-box" type="text"></td>
                                    <td><input id="c4" placeholder=" " class="l-box" type="text"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Letters ruled out entirely. Typing one in the first box files it away. -->
                    <div id="graveyard" class="wordle-row bg-danger help-only" hidden>
                        <table border="3">
                            <colgroup><col span="5"></colgroup>
                            <tbody>
                                <tr class="graveyard0">
                                    <td><input placeholder=" " class="l-box" type="text"></td>
                                </tr>
                                <tr class="graveyard1"></tr>
                                <tr class="graveyard2"></tr>
                                <tr class="graveyard3"></tr>
                                <tr class="graveyard4"></tr>
                                <tr class="graveyard5"></tr>
                            </tbody>
                        </table>
                    </div>

                </div>
                <div class="word-panel">
                    <p class="strong-bank" style="padding-left: 15px;"></p>
                    <p class="bank" style="padding-left: 15px;"></p>
                </div>
            </div>

            <div class="tab-pane fade" id="word500-pane" role="tabpanel">
                <div class="input-panel">
                    <div id="w5-board"></div>
                    <div style="padding: 6px 15px;">
                        <label>
                            <input type="checkbox" id="w5-hard-mode"> Hard mode
                        </label>
                        <span class="w5-count" style="padding-left: 15px;"></span>
                    </div>
                </div>
                <div class="word-panel">
                    <p class="strong-bank w5-strong-bank" style="padding-left: 15px;"></p>
                    <p class="w5-bank" style="padding-left: 15px;"></p>
                </div>
            </div>
        </div>
    </div>

    <%= footer %>

</body>

</html>
