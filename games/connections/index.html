<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png">
    <link rel="manifest" href="/connections/manifest.json">
    <title>Connections Helper</title>
    <!-- Facebook Meta -->
    <meta property="og:url" content="https://playbook.trailmatt.com/connections" />
    <meta property="og:title" content="Connections Helper" />
    <meta property="og:description"
        content="Solve Connections Puzzles! This tool helps by allowing you to plan all moves before submitting. No more missing tricky categories." />
    <meta property="og:image" content="https://playbook.trailmatt.com/img/og-image.jpg" />
    <!-- Twitter Meta -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Connections Helper" />
    <meta name="twitter:url" content="https://playbook.trailmatt.com/connections" />
    <meta name="twitter:site" content="@MattGHall" />
    <meta name="twitter:creator" content="@MattGHall">
    <meta name="twitter:description"
        content="Solve Connections Puzzles! This tool helps by allowing you to plan all moves before submitting. No more missing tricky categories." />
    <meta name="twitter:image" content="https://playbook.trailmatt.com/img/og-image.jpg" />

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="/dep/jquery-3.5.1.min.js"></script>
    <link href="/dep/bootstrap.min.css" rel="stylesheet">
    <link href="/dep/bootstrap.min.css.map" rel="stylesheet">
    <script src="/dep/bootstrap.min.js"></script>

</head>

<body>
    <div class="container mt-5 mt-md-3">
        <div class="row">
            <div class="col-12 col-lg-6 offset-lg-3">
                <div id="game-div" class="row">
                    <div class="col-12">
                        <div id="buttons-div" class="row">
                            <div class="col-6 col-sm-3">
                                <button id="shuffle-btn" class="game-btn btn btn-primary">Shuffle</button>
                            </div>
                            <div class="col-6 col-sm-3">
                                <button id="sort-btn" class="game-btn btn btn-secondary">Sort</button>
                            </div>
                            <div class="col-6 col-sm-3">
                                <button id="clear-btn" class="game-btn btn btn-danger">Reset</button>
                            </div>
                            <div class="col-6 col-sm-3">
                                <input type="date" id="date-picker" class="form-control game-btn">
                            </div>
                        </div>
                    </div>
                    <div id="grid" class="grid col-12 mt-3">
                        <!-- Boxes will be created dynamically -->
                    </div>
                </div>
                <div class="col-12 mt-2">
                    <div class="row">
                        <!-- First Icon -->
                        <div class="col text-center">
                            <a href="#" class="icon-clickable btn lock lock-yellow unlocked disabled">
                                <i data-feather="lock" class="d-none"></i>
                                <i data-feather="unlock"></i>
                            </a>
                        </div>
                        <!-- Second Icon -->
                        <div class="col text-center">
                            <a href="#" class="icon-clickable btn lock lock-green unlocked disabled">
                                <i data-feather="lock" class="d-none"></i>
                                <i data-feather="unlock"></i>
                            </a>
                        </div>
                        <!-- Third Icon -->
                        <div class="col text-center">
                            <a href="#" class="icon-clickable btn lock lock-blue unlocked disabled">
                                <i data-feather="lock" class="d-none"></i>
                                <i data-feather="unlock"></i>
                            </a>
                        </div>
                        <!-- Fourth Icon -->
                        <div class="col text-center">
                            <a href="#" class="icon-clickable btn lock lock-purple unlocked disabled">
                                <i data-feather="lock" class="d-none"></i>
                                <i data-feather="unlock"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <%= footer %>

</body>

</html>
