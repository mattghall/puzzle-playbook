<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png">
    <link rel="manifest" href="/geogrid/manifest.json">
    <link rel="preconnect" href="https://flagcdn.com" crossorigin>
    <title>Geogrid Helper</title>
    <!-- Facebook Meta -->
    <meta property="og:url" content="https://playbook.trailmatt.com/geogrid" />
    <meta property="og:title" content="Geogrid Helper" />
    <meta property="og:description"
        content="A scratchpad for the daily Geogrid puzzle. Collect the countries that fit each category, then try them in the squares before you guess." />
    <!-- Twitter Meta -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Geogrid Helper" />
    <meta name="twitter:url" content="https://playbook.trailmatt.com/geogrid" />
    <meta name="twitter:site" content="@MattGHall" />
    <meta name="twitter:creator" content="@MattGHall">
    <meta name="twitter:description"
        content="A scratchpad for the daily Geogrid puzzle. Collect the countries that fit each category, then try them in the squares before you guess." />

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="/dep/jquery-3.5.1.min.js"></script>
    <link href="/dep/bootstrap.min.css" rel="stylesheet">
    <script src="/dep/bootstrap.min.js"></script>

</head>

<body>
    <div class="container mt-2">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10">
                <div id="buttons-div" class="row">
                    <div class="col-6">
                        <button id="clear-btn" class="game-btn btn btn-danger">Reset</button>
                    </div>
                    <div class="col-6">
                        <input type="date" id="date-picker" class="form-control game-btn">
                    </div>
                </div>
                <div id="grid" class="grid">
                    <!-- Category headers and squares are created dynamically -->
                </div>
                <div id="flag-note" class="flag-note" style="display: none">Flags hidden to prevent spoilers</div>
                <div id="editor" class="editor">
                    <!-- The open category's list is created dynamically -->
                </div>
                <div id="hint" class="hint">Click a category to list the countries that fit it. Anything you list under two
                    categories shows up in their square, ready to pick.</div>
                <div id="fetch-error" class="alert alert-warning mt-2" style="display: none"></div>
            </div>
        </div>
    </div>

    <%= footer %>

</body>

</html>
