<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png">
    <link rel="manifest" href="/weaver/manifest.json">
    <title>Weaver Helper</title>
    <!-- Facebook Meta -->
    <meta property="og:url" content="https://playbook.trailmatt.com/weaver" />
    <meta property="og:title" content="Weaver Helper" />
    <meta property="og:description"
        content="A scratchpad for the daily Weaver puzzle. Build the word ladder from either end and check every rung before you commit." />
    <!-- Twitter Meta -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Weaver Helper" />
    <meta name="twitter:url" content="https://playbook.trailmatt.com/weaver" />
    <meta name="twitter:site" content="@MattGHall" />
    <meta name="twitter:creator" content="@MattGHall">
    <meta name="twitter:description"
        content="A scratchpad for the daily Weaver puzzle. Build the word ladder from either end and check every rung before you commit." />

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="/dep/jquery-3.5.1.min.js"></script>
    <link href="/dep/bootstrap.min.css" rel="stylesheet">
    <script src="/dep/bootstrap.min.js"></script>

</head>

<body>
    <div class="container mt-2">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-6">
                <div id="buttons-div" class="row">
                    <div class="col-6">
                        <button id="clear-btn" class="game-btn btn btn-danger">Reset</button>
                    </div>
                    <div class="col-6">
                        <input type="date" id="date-picker" class="form-control game-btn">
                    </div>
                </div>
                <div id="ladder" class="ladder">
                    <!-- The rungs of the ladder are created dynamically -->
                    <input id="typer" class="typer" type="text" autocomplete="off" autocorrect="off"
                        autocapitalize="off" spellcheck="false" aria-label="Type a word">
                </div>
                <div id="status" class="status"></div>
                <div id="fetch-error" class="alert alert-warning mt-2" style="display: none"></div>
            </div>
        </div>
    </div>

    <%= footer %>

</body>

</html>
